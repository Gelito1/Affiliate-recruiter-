<style>
:root{--bg:#050403;--sf:#100c06;--sf2:#17110a;--tx:#f7efdc;--mu:#a99d86;--gd:#f5b800;--gd2:#ffd84a;--ln:#2e2310;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#050403}}
:root[data-theme="dark"]{--bg:#050403}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif;line-height:1.65;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(700px 500px at 50% -10%,#f5b80030,transparent),radial-gradient(500px 400px at 100% 60%,#f5b80014,transparent),repeating-linear-gradient(135deg,transparent 0 60px,#f5b80006 60px 61px)}
a{color:inherit;text-decoration:none}.w{max-width:1040px;margin:auto;padding:0 22px}
h1,h2,h3,.ex{font-family:"Exo 2",system-ui,sans-serif;font-style:italic;font-weight:900;text-transform:uppercase;letter-spacing:-.5px}
.gt{background:linear-gradient(100deg,#fff 0,var(--gd2) 40%,var(--gd) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
header{position:sticky;top:0;z-index:30;background:#050403cc;backdrop-filter:blur(12px);border-bottom:1px solid var(--ln)}
.nav{display:flex;align-items:center;gap:12px;height:64px}
.nav img{width:40px;height:40px;border-radius:50%}.nav b{font-size:17px}
.nav .sp{flex:1}
select{background:var(--sf);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:8px 10px;font:inherit;font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:14px 28px;font-family:"Exo 2",sans-serif;font-style:italic;font-weight:800;text-transform:uppercase;letter-spacing:.5px;border:1px solid var(--gd);color:var(--tx);cursor:pointer;transition:.3s;transform:skewX(-10deg);border-radius:4px;background:transparent;font-size:15px}
.btn>span{display:inline-block;transform:skewX(10deg)}
.gd{background:linear-gradient(135deg,var(--gd2),var(--gd));color:#1a1200;border:0;box-shadow:0 0 34px #f5b80055}.gd:hover{box-shadow:0 0 56px #f5b800aa;transform:skewX(-10deg) translateY(-3px)}
.ol:hover{background:var(--gd);color:#1a1200}
.sm{padding:9px 18px;font-size:13px}
.hero{padding:56px 0 40px;text-align:center;position:relative}
.ring{width:170px;height:170px;margin:0 auto;border-radius:50%;padding:5px;background:conic-gradient(from 0deg,var(--gd2),#7a5600,var(--gd2),#7a5600,var(--gd2));animation:sp 8s linear infinite;box-shadow:0 0 70px #f5b80066}
.ring img{width:100%;height:100%;border-radius:50%;display:block;animation:sp 8s linear infinite reverse}
@keyframes sp{to{transform:rotate(360deg)}}
h1{font-size:clamp(38px,8.5vw,92px);line-height:.98;margin:34px 0 16px}
.sub{max-width:580px;margin:0 auto;color:var(--mu);font-size:17px}
.row{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;margin-top:34px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:54px}
.stat{background:linear-gradient(160deg,var(--sf2),var(--sf));border:1px solid var(--ln);padding:22px;clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,0 100%)}
.stat b{display:block;font-family:"Exo 2",sans-serif;font-style:italic;font-size:44px;font-weight:900;line-height:1.1}
.stat small{color:var(--mu);letter-spacing:2px;text-transform:uppercase;font-size:11px}
.mq{overflow:hidden;border-block:1px solid var(--ln);background:var(--sf);padding:16px 0;margin:30px 0}
.mt{display:flex;gap:46px;width:max-content;animation:mv 35s linear infinite}.mt span{font-family:"Exo 2",sans-serif;font-style:italic;font-weight:800;text-transform:uppercase;font-size:22px;color:var(--mu);white-space:nowrap}.mt span:before{content:"◆ ";color:var(--gd)}
@keyframes mv{to{transform:translateX(-50%)}}
section{padding:60px 0}
.k{color:var(--gd);letter-spacing:5px;text-transform:uppercase;font-size:11px;font-weight:700}
h2{font-size:clamp(30px,5.5vw,54px);margin:6px 0 10px;line-height:1.05}
.lead{color:var(--mu);max-width:580px;margin:0 0 32px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.st{position:relative;background:var(--sf);border:1px solid var(--ln);padding:28px 22px;overflow:hidden;transition:.35s}
.st:hover{border-color:var(--gd);transform:translateY(-6px);box-shadow:0 14px 44px #f5b80022}
.st i{position:absolute;right:-6px;top:-18px;font-family:"Exo 2",sans-serif;font-style:italic;font-weight:900;font-size:110px;color:#f5b80014}
.st h3{margin:0 0 6px;font-size:24px;color:var(--gd2)}.st p{margin:0;color:var(--mu);font-size:14px}
.pills{display:flex;flex-wrap:wrap;gap:10px}
.pill{border:1px solid var(--ln);background:var(--sf);padding:11px 20px;font-size:14px;font-weight:600;cursor:pointer;transition:.25s;user-select:none;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%)}
.pill:hover,.pill.on{color:#1a1200;background:linear-gradient(135deg,var(--gd2),var(--gd));border-color:transparent}
details{background:var(--sf);border:1px solid var(--ln);padding:16px 22px;margin-bottom:10px}summary{cursor:pointer;font-weight:600}details[open]{border-color:var(--gd)}details p{color:var(--mu);margin:10px 0 0}
.fw{background:linear-gradient(160deg,var(--sf2),var(--sf));border:1px solid var(--gd);padding:30px;box-shadow:0 0 60px #f5b80022}
form{display:grid;gap:16px}
.f2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
label.l{display:grid;gap:6px;font-size:12px;color:var(--mu);letter-spacing:1px;text-transform:uppercase}
input[type=text]{background:#0a0704;border:1px solid var(--ln);color:var(--tx);padding:13px;font:inherit;font-size:15px;width:100%;text-transform:none;letter-spacing:0}
input:focus,select:focus{outline:2px solid var(--gd);outline-offset:1px}
.hp{position:absolute;left:-9999px;height:0;overflow:hidden}
#out{display:none;border:1px solid var(--gd);padding:18px}#out.s{display:block}
footer{border-top:1px solid var(--ln);padding:36px 0 90px;color:var(--mu);font-size:13px;text-align:center}
.fab{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;z-index:40}
.fab a{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:13px;box-shadow:0 0 28px #000a;transition:.3s}.fab a:hover{transform:scale(1.1)}
.rv{opacity:0;transform:translateY(30px);transition:.9s}.rv.in{opacity:1;transform:none}
@media(max-width:560px){.nav b{display:none}.btn{padding:13px 20px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}html{scroll-behavior:auto}}

/* professional refinement */
body{font-family:Inter,system-ui,sans-serif}
body:before{background:radial-gradient(800px 420px at 50% -10%,#f5b8001f,transparent)}
h1,h2,h3,.ex{font-family:Inter,system-ui,sans-serif;font-style:normal;text-transform:none;font-weight:700;letter-spacing:-.025em}
h1{font-size:clamp(34px,6vw,64px);line-height:1.08;margin:30px 0 16px}
h2{font-size:clamp(26px,4vw,40px);line-height:1.15}
.gt{background:linear-gradient(100deg,#ffe7a1,var(--gd2) 45%,var(--gd));-webkit-background-clip:text;background-clip:text;color:transparent}
.nav b{font-size:16px;font-weight:600}
.btn{transform:none;border-radius:10px;font-family:Inter,sans-serif;font-style:normal;text-transform:none;font-weight:600;letter-spacing:0;font-size:15px;padding:13px 24px}
.btn>span{transform:none}
.gd{box-shadow:0 6px 24px #f5b80033}.gd:hover{transform:translateY(-2px);box-shadow:0 10px 30px #f5b80055}
.ol{border-color:#f5b80066}.ol:hover{transform:translateY(-2px)}
.sm{padding:9px 18px;font-size:14px}
.ring{animation:none;width:128px;height:128px;padding:3px;background:linear-gradient(135deg,var(--gd2),#7a5600);box-shadow:0 10px 50px #f5b80040}
.ring img{animation:none}
.hero{padding:64px 0 30px}
.sub{font-size:18px;max-width:600px}
.stats{gap:16px;margin-top:56px}
.stat{clip-path:none;border-radius:16px;padding:24px;text-align:left}
.stat b{font-family:Inter,sans-serif;font-style:normal;font-size:38px;font-weight:700;letter-spacing:-.03em;display:flex;align-items:center;height:48px}
.stat small{letter-spacing:.14em;font-weight:600}
.mt span{font-family:Inter,sans-serif;font-style:normal;text-transform:uppercase;letter-spacing:.14em;font-size:13px;font-weight:600}
.mq{margin:36px 0;padding:14px 0}
.k{letter-spacing:.2em;font-weight:600}
.st{border-radius:16px}.st i{font-family:Inter,sans-serif;font-style:normal;font-weight:800;font-size:96px;top:-14px}
.st h3{font-size:19px;font-weight:600;letter-spacing:-.01em}
.pill{clip-path:none;border-radius:99px;padding:10px 18px;font-weight:500}
details{border-radius:14px}
section{padding:68px 0}
</style>
